# CI de festa-ai-service (RF8, RF9).
# 1) Escaneo de secretos y vulnerabilidades, y CodeQL (Python): workflow reutilizable de la organización.
# 2) Linter (ruff) y pruebas (pytest, con MongoDB real y los contratos de festa-infra).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    uses: Desparcha2-SWNT/.github/.github/workflows/ci-reusable.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      stack: none
      enable-codeql: true
      codeql-language: python

  python:
    name: Linter y pruebas (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Descargar contratos de festa-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Desparcha2-SWNT/festa-infra
          ref: develop
          path: .festa-infra
          sparse-checkout: contracts

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: "pip install --only-binary :all: -r requirements-dev.txt"

      - name: Linter (ruff)
        run: ruff check app tests

      - name: Pruebas
        run: python -m pytest -q --junitxml=test-results/junit.xml --cov=app --cov-branch --cov-report=term --cov-report=json:coverage.json --cov-report=xml:coverage.xml
        env:
          FESTA_CONTRACTS_DIR: ${{ github.workspace }}/.festa-infra/contracts
          TEST_MONGO_URL: mongodb://localhost:27017/ai_test

      - name: Resumen de cobertura
        if: always() && hashFiles('coverage.json') != ''
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          t = json.load(open("coverage.json"))["totals"]
          print("## Cobertura de pruebas (app/)")
          print()
          print("| Métrica | Cobertura | Cubiertas |")
          print("|---|---|---|")
          print(f"| Líneas | {100 * t['covered_lines'] / max(t['num_statements'], 1):.2f} % | {t['covered_lines']} de {t['num_statements']} |")
          print(f"| Ramas | {100 * t['covered_branches'] / max(t['num_branches'], 1):.2f} % | {t['covered_branches']} de {t['num_branches']} |")
          print(f"| Total (líneas y ramas) | {t['percent_covered']:.2f} % | |")
          EOF

      # Análisis de SonarCloud desde el CI, con la cobertura (coverage.xml de pytest-cov).
      # Requiere SONAR_TOKEN (secreto de la organización) y el análisis automático apagado en el proyecto.
      - name: Análisis de SonarCloud
        if: always() && hashFiles('coverage.xml') != ''
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=desparcha2-swnt
            -Dsonar.projectKey=Desparcha2-SWNT_festa-ai-service
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Publicar resultados de pruebas en el PR
        if: always()
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5
        with:
          report_paths: test-results/junit.xml
          check_name: Pruebas pytest
          include_passed: true
